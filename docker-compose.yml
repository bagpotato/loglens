name: loglens

services:
  loki:
    image: grafana/loki:3.7.10
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      # Local debugging only. Remote agents push through the web service with LOGLENS_PUSH_TOKEN.
      - "127.0.0.1:${LOGLENS_LOKI_PORT:-3100}:3100"
    restart: unless-stopped

  api:
    build: ./backend
    image: ghcr.io/bagpotato/loglens-api:${LOGLENS_VERSION:-0.1.0}
    env_file: .env
    environment:
      LOGLENS_BIND: 0.0.0.0:8080
      LOGLENS_DB_URL: sqlite:///data/loglens.db
    volumes:
      - api-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"ok\"' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  web:
    build: ./frontend
    image: ghcr.io/bagpotato/loglens-web:${LOGLENS_VERSION:-0.1.0}
    ports:
      # Set LOGLENS_WEB_BIND=127.0.0.1 to reach LogLens only through Tailscale.
      - "${LOGLENS_WEB_BIND:-0.0.0.0}:${LOGLENS_WEB_PORT:-8080}:80"
    environment:
      LOGLENS_PUSH_TOKEN: ${LOGLENS_PUSH_TOKEN:-}
      NGINX_ENVSUBST_FILTER: "^LOGLENS_"
    depends_on:
      api:
        condition: service_started
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  ntfy:
    image: binwiederhier/ntfy:v2.38.1
    command: ["serve"]
    init: true
    environment:
      NTFY_BASE_URL: ${LOGLENS_NTFY_BASE_URL:-}
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_UPSTREAM_BASE_URL: ${LOGLENS_NTFY_UPSTREAM_BASE_URL:-}
      TZ: ${TZ:-UTC}
    volumes:
      - ntfy-cache:/var/cache/ntfy
    ports:
      # Subscribe to the alert topic from the ntfy phone app at http://<server>:8090.
      - "${LOGLENS_NTFY_BIND:-0.0.0.0}:${LOGLENS_NTFY_PORT:-8090}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O - http://127.0.0.1:80/v1/health | grep -Eq '\"healthy\" *: *true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Optional: `docker compose --profile tailscale up -d` joins your tailnet as TS_HOSTNAME and serves
  # https://<TS_HOSTNAME>.<tailnet>.ts.net (web UI, API, agent pushes) and :8443 (ntfy) with a valid certificate.
  tailscale:
    image: tailscale/tailscale:v1.104.7
    profiles: ["tailscale"]
    hostname: ${TS_HOSTNAME:-loglens}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-loglens}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    depends_on:
      web:
        condition: service_started
      ntfy:
        condition: service_started
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.17
    profiles: ["ollama"]
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  loki-data:
  api-data:
  ntfy-cache:
  ollama-data:
  tailscale-state:
