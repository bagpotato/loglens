name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: backend
          - name: web
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="${GITHUB_REF_NAME#v}"
          echo "image=ghcr.io/${owner}/loglens-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  bundles:
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v4
      - name: Build release bundles
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out
          deploy="loglens-deploy-${version}"
          mkdir -p "$deploy/loki" "$deploy/tailscale"
          # The deploy bundle pulls the published images instead of building from source.
          sed '/^[[:space:]]*build:/d' docker-compose.yml > "$deploy/docker-compose.yml"
          cp .env.example init-env.sh README.md "$deploy/"
          cp loki/loki-config.yaml "$deploy/loki/"
          cp tailscale/serve.json "$deploy/tailscale/"
          tar czf "out/${deploy}.tar.gz" "$deploy"
          agent="loglens-agent-${version}"
          mkdir -p "$agent"
          cp -r agent/. "$agent/"
          rm -rf "$agent/vector/tests"
          cp demo/generate-logs.sh "$agent/"
          tar czf "out/${agent}.tar.gz" "$agent"
          (cd out && sha256sum *.tar.gz > SHA256SUMS)
          cat out/SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || notes=/dev/null
          gh release create "$GITHUB_REF_NAME" out/* --draft \
            --title "LogLens ${GITHUB_REF_NAME}" --notes-file "$notes"
