name: "journald PRIORITY 2 without a rule is critical by default"
inputs:
  - insert_at: normalize
    type: log
    log_fields:
      source_type: journald
      host: app1
      message: "payment queue stalled"
      SYSLOG_IDENTIFIER: billing
      PRIORITY: "2"
outputs:
  - extract_from: severity
    conditions:
      - type: vrl
        source: |
          assert_eq!(.source, "other")
          assert_eq!(.severity, "critical")
          assert_eq!(.severity_source, "default")
