name: "nginx access line with 502 is important"
inputs:
  - insert_at: normalize
    type: log
    log_fields:
      source_type: file
      host: web1
      file: /var/log/nginx/access.log
      message: "198.51.100.7 - - [21/Nov/2026:10:00:00 +0000] \"GET /api/orders HTTP/1.1\" 502 157 \"-\" \"curl/8.5.0\""
outputs:
  - extract_from: severity
    conditions:
      - type: vrl
        source: |
          assert_eq!(.source, "nginx")
          assert_eq!(.severity, "important")
          assert_eq!(.severity_source, "rule")
