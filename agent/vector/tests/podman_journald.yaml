name: "podman container via journald gets container label"
inputs:
  - insert_at: normalize
    type: log
    log_fields:
      source_type: journald
      host: app1
      message: "connection timeout, retrying"
      SYSLOG_IDENTIFIER: 3f2a1b9c8d7e
      CONTAINER_NAME: webapp
      _COMM: conmon
      PRIORITY: "6"
outputs:
  - extract_from: severity
    conditions:
      - type: vrl
        source: |
          assert_eq!(.source, "podman")
          assert_eq!(.container, "webapp")
          assert_eq!(.loki_extra_labels, {"container": "webapp"})
          assert_eq!(.severity, "warning")
          assert_eq!(.severity_source, "rule")
