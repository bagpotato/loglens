name: "sshd failed password via journald is ssh/important by rule"
inputs:
  - insert_at: normalize
    type: log
    log_fields:
      source_type: journald
      host: web1
      message: "Failed password for root from 203.0.113.5 port 52144 ssh2"
      SYSLOG_IDENTIFIER: sshd
      _SYSTEMD_UNIT: ssh.service
      PRIORITY: "6"
outputs:
  - extract_from: severity
    conditions:
      - type: vrl
        source: |
          assert_eq!(.host, "web1")
          assert_eq!(.source, "ssh")
          assert_eq!(.unit, "ssh.service")
          assert_eq!(.severity, "important")
          assert_eq!(.severity_source, "rule")
          assert_eq!(.loki_extra_labels, {})
          assert!(!exists(.container))
